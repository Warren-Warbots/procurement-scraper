<!doctype html>
<html>
<head><title>Amazon.com Shopping Cart</title></head>
<body>
  <form id="activeCartViewForm">
    <div id="sc-active-cart" data-name="Active Items">
      <div class="sc-list-item" data-asin="B07ABCDEFG" data-itemtotal="25.98">
        <span class="sc-product-title">Rust-Oleum 271919 Acrylic Enamel 2X Spray Paint, 12 oz, Gloss White</span>
        <input class="sc-quantity-textfield" value="2" />
        <span class="sc-product-price">$12.99</span>
      </div>
      <div class="sc-list-item" data-asin="B09XYZ1234" data-itemtotal="8.49">
        <span class="sc-product-title">Silver Ink Marker, Fine Tip</span>
        <input class="sc-quantity-textfield" value="1" />
        <span class="sc-product-price">$8.49</span>
      </div>
    </div>
  </form>

  <div id="sc-saved-cart" data-name="Saved Items">
    <div class="sc-list-item" data-asin="BSAVED0000" data-itemtotal="99.99">
      <span class="sc-product-title">Saved For Later — should be ignored</span>
      <span class="sc-product-price">$99.99</span>
    </div>
  </div>
</body>
</html>
